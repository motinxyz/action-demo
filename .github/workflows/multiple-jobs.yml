name: Multiple Jobs Demo

# on: [push]
on:
    workflow_dispatch:

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6

            - name: Run Shell Script
              run: |
                  chmod +x ascii-script.sh
                  ./ascii-script.sh

            - name: Upload Dragon Text File
              uses: actions/upload-artifact@v4
              with:
                  name: dragon-text
                  path: dragon.txt
    test_job_1:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:
            - name: Run Tests
              run: echo "Tests completed"

            - name: Download Dragon Text File
              uses: actions/download-artifact@v4
              with:
                  name: dragon-text

            - name: Read Dragon Text File
              run: |
                  cat dragon.txt
                  echo "From Build Job..."
                  echo "Dragon is tired...."

    deploy_job_1:
        needs: [test_job_1]
        runs-on: ubuntu-latest
        steps:
            - name: Deploy
              run: echo "Deployment completed"

            - name: Sleep for 10 seconds
              run: sleep 10
