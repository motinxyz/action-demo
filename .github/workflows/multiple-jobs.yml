name: Multiple Jobs

on: [push]

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6

            - name: Run Shell Script
              run: |
                  chmod +x ascii-script.sh
                  ./ascii-script.sh

            - name: Sleep for 10 seconds
              run: sleep 10
    test_job_1:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:
            - name: Run Tests
              run: echo "Tests completed"

            - name: Sleep for 10 seconds
              run: sleep 10

    deploy_job_1:
        needs: [test_job_1]
        runs-on: ubuntu-latest
        steps:
            - name: Deploy
              run: echo "Deployment completed"

            - name: Sleep for 10 seconds
              run: sleep 10
